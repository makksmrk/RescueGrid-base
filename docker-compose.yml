services:

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "${HOST_MQTT_PORT:-1883}:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ready"]
      interval: 3s
      timeout: 2s
      retries: 10

  control-center:
    build:
      context: .
      dockerfile: services/control-center/Dockerfile
    container_name: control-center

    ports:
      - "${HOST_HTTP_PORT:-8080}:8080"
      - "${HOST_RPC_PORT:-50051}:50051"
    environment:
      MQTT_URL: mqtt://mqtt-broker:1883
      HTTP_PORT: 8080
      RPC_PORT: 50051
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get({ host: '127.0.0.1', port: process.env.HTTP_PORT || 8080, path: '/health' }, res => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); }); req.setTimeout(2000, () => req.destroy()); req.on('error', () => process.exit(1));"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      mqtt-broker:
        condition: service_healthy

  drone-1:
    build:
      context: .
      dockerfile: services/emergency-vehicle/Dockerfile
    container_name: drone-1
    environment:
      VEHICLE_ID: drone-1
      VEHICLE_ROLE: drone
      RPC_PORT: 50052
      MQTT_URL: mqtt://mqtt-broker:1883
      COORDINATION_PEERS: drone-1,repair-rover-1,supply-rover-1
    depends_on:
      control-center:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy

  repair-rover-1:
    build:
      context: .
      dockerfile: services/emergency-vehicle/Dockerfile
    container_name: repair-rover-1
    environment:
      VEHICLE_ID: repair-rover-1
      VEHICLE_ROLE: repair_rover
      RPC_PORT: 50053
      MQTT_URL: mqtt://mqtt-broker:1883
      COORDINATION_PEERS: drone-1,repair-rover-1,supply-rover-1
    depends_on:
      control-center:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy

  supply-rover-1:
    build:
      context: .
      dockerfile: services/emergency-vehicle/Dockerfile
    container_name: supply-rover-1
    environment:
      VEHICLE_ID: supply-rover-1
      VEHICLE_ROLE: supply_rover
      RPC_PORT: 50054
      MQTT_URL: mqtt://mqtt-broker:1883
      COORDINATION_PEERS: drone-1,repair-rover-1,supply-rover-1
    depends_on:
      control-center:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy

  water-sensor:
    build:
      context: .
      dockerfile: services/sensors/water-sensor/Dockerfile
    container_name: water-sensor
    environment:
      MQTT_URL: mqtt://mqtt-broker:1883
    depends_on:
      control-center:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy

  camera-sensor:
    build:
      context: .
      dockerfile: services/sensors/camera-sensor/Dockerfile
    container_name: camera-sensor
    environment:
      MQTT_URL: mqtt://mqtt-broker:1883
    depends_on:
      control-center:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
